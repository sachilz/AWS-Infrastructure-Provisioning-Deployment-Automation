
---
# Install and configure Nginx, then deploy the website.

- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Ensure web root exists
  ansible.builtin.file:
    path: /var/www/html
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy website files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../website/"
    dest: /var/www/html/
    owner: root
    group: root
    mode: preserve
  notify: Reload nginx

- name: Install Nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Ensure Nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

